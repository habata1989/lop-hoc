<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý lớp học</title>
<style>
:root{--bg:#f5f6fa;--c:#fff;--t:#1d2433;--p:#2f6fed;--b:#d8dce6}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--c:#1d2230;--t:#e8ebf3;--p:#5b8cff;--b:#343b4f}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--b)}
header b{margin-right:auto}main{padding:16px;max-width:1000px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;margin:10px 0;display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
button{background:var(--p);color:#fff;border:0;cursor:pointer}button.ghost{background:transparent;color:var(--p);border:1px solid var(--p)}
header button{background:transparent;color:var(--t);border:1px solid var(--b)}header button.on{background:var(--p);color:#fff}
table{width:100%;border-collapse:collapse;background:var(--c)}th,td{border:1px solid var(--b);padding:6px 8px;text-align:left;vertical-align:top}
.sc{overflow-x:auto}@media print{header,.noprint{display:none}body{background:#fff;color:#000}}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== THAY 2 GIÁ TRỊ NÀY ======
const SUPABASE_URL='https://ofiyudvskwxnlfejdjln.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9maXl1ZHZza3d4bmxmZWpkamxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NDUwNTEsImV4cCI6MjEwOTIyMTA1MX0.YvhMSLswdYYw8epj170TJ1iuvmZW9WdBONIpuBGYnis';
// ================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S={classes:[],students:[]},M,R=[],tab='classes';
async function q(p){const r=await p;if(r.error){alert('Lỗi: '+r.error.message);throw r.error}return r.data}
const clsOpts=(sel)=>S.classes.map(c=>`<option value="${c.id}" ${c.id==sel?'selected':''}>${esc(c.name)}</option>`).join('');
const clsName=id=>(S.classes.find(c=>c.id==id)||{}).name||'—';

// ---------- Đăng nhập ----------
function authView(){
  A.innerHTML=`<div class="card" style="max-width:360px;margin:60px auto;flex-direction:column"><h2 style="margin:0">Quản lý lớp học</h2>
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Mật khẩu (từ 6 ký tự)">
  <button id="li">Đăng nhập</button><button class="ghost" id="su">Đăng ký tài khoản mới</button></div>`;
  $('#li').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)alert(error.message)};
  $('#su').onclick=async()=>{const{data,error}=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value});
    alert(error?error.message:(data.session?'Đăng ký thành công!':'Đã đăng ký. Hãy kiểm tra email để xác nhận rồi đăng nhập.'))};
}
sb.auth.onAuthStateChange((_e,se)=>setTimeout(()=>boot(se),0));
async function boot(se){
  if(!se){authView();return}
  const t=await q(sb.from('teachers').select('user_id').eq('user_id',se.user.id));
  if(t.length){await loadAll();shell();nav(tab)}else studentView();
}
async function loadAll(){
  S.classes=await q(sb.from('classes').select('*').order('name'));
  S.students=await q(sb.from('students').select('*').order('name'));
}
const TABS={classes:['Lớp học',vClasses],students:['Học sinh',vStudents],att:['Điểm danh',vAtt],fee:['Học phí',vFee]};
function shell(){
  A.innerHTML=`<header><b>📚 Quản lý lớp học</b>${Object.entries(TABS).map(([k,v])=>`<button data-k="${k}" onclick="nav('${k}')">${v[0]}</button>`).join('')}<button onclick="sb.auth.signOut()">Đăng xuất</button></header><main id="main"></main>`;
  M=$('#main');
}
function nav(k){tab=k;document.querySelectorAll('header [data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k==k));TABS[k][1]()}
async function reload(){await loadAll();nav(tab)}

// ---------- Học sinh (đăng ký + liên kết Mã HS) ----------
async function studentView(){
  A.innerHTML=`<header><b>📚 Cổng học sinh</b><button onclick="sb.auth.signOut()">Đăng xuất</button></header><main id="main"></main>`;M=$('#main');
  const me=await q(sb.from('students').select('*').limit(1));
  if(me.length){M.innerHTML=`<div class="card">Xin chào <b>${esc(me[0].name)}</b>. Phần bài tập sẽ có ở bản cập nhật tiếp theo.</div>`;return}
  M.innerHTML=`<div class="card"><b>Nhập Mã HS (6 ký tự) do giáo viên cấp — chỉ một lần:</b><input id="mc" maxlength="6" placeholder="VD: A1B2C3"><button id="lk">Liên kết</button></div>`;
  $('#lk').onclick=async()=>{const r=await q(sb.rpc('link_student',{p_code:$('#mc').value}));
    if(r==='ok'||r==='already')studentView();else alert('Mã HS không đúng hoặc đã được dùng.')};
}

// ---------- Lớp học ----------
function vClasses(){
  M.innerHTML=`<h3>Lớp học</h3><div class="sc"><table><tr><th>Tên lớp</th><th>Học phí/buổi (đ)</th><th></th></tr>
  ${S.classes.map(c=>`<tr><td><input id="n${c.id}" value="${esc(c.name)}"></td><td><input id="f${c.id}" type="number" value="${c.fee}"></td>
  <td><button onclick="saveC('${c.id}')">Lưu</button> <button class="ghost" onclick="delC('${c.id}')">Xóa</button></td></tr>`).join('')}</table></div>
  <div class="card"><input id="nn" placeholder="Tên lớp mới"><input id="nf" type="number" placeholder="Học phí/buổi"><button onclick="addC()">Thêm lớp</button></div>`;
}
async function addC(){if(!$('#nn').value.trim())return;await q(sb.from('classes').insert({name:$('#nn').value.trim(),fee:+$('#nf').value||0}));reload()}
async function saveC(id){await q(sb.from('classes').update({name:$('#n'+id).value.trim(),fee:+$('#f'+id).value||0}).eq('id',id));alert('Đã lưu. Học phí mới chỉ áp dụng cho các buổi điểm danh từ nay.');reload()}
async function delC(id){if(confirm('Xóa lớp này? Học sinh của lớp sẽ chưa có lớp.')){await q(sb.from('classes').delete().eq('id',id));reload()}}

// ---------- Học sinh ----------
function vStudents(){
  M.innerHTML=`<h3>Học sinh</h3><div class="card"><input type="hidden" id="sid"><input id="sn" placeholder="Họ tên"><select id="sc"><option value="">-- Lớp --</option>${clsOpts()}</select>
  <input id="sp" placeholder="SĐT phụ huynh"><select id="sd"><option value="none">Không giảm trừ</option><option value="percent">Giảm theo %</option><option value="fixed">Giảm số tiền cố định/tháng</option></select>
  <input id="sv" type="number" value="0" placeholder="% hoặc số tiền"><input id="sr" placeholder="Lý do giảm trừ"><button onclick="saveS()">Lưu học sinh</button></div>
  <div class="sc"><table><tr><th>Mã HS</th><th>Họ tên</th><th>Lớp</th><th>SĐT PH</th><th>Giảm trừ</th><th></th></tr>
  ${S.students.map(s=>`<tr><td><b>${s.code}</b></td><td>${esc(s.name)}</td><td>${esc(clsName(s.class_id))}</td><td>${esc(s.parent_phone)}</td>
  <td>${s.discount_type=='none'?'—':(s.discount_type=='percent'?s.discount_value+'%':vnd(s.discount_value))+' '+esc(s.discount_reason)}</td>
  <td><button onclick="editS('${s.id}')">Sửa</button> <button class="ghost" onclick="delS('${s.id}')">Xóa</button></td></tr>`).join('')}</table></div>`;
}
function editS(id){const s=S.students.find(x=>x.id==id);$('#sid').value=id;$('#sn').value=s.name;$('#sc').value=s.class_id||'';$('#sp').value=s.parent_phone||'';$('#sd').value=s.discount_type;$('#sv').value=s.discount_value;$('#sr').value=s.discount_reason||'';scrollTo(0,0)}
async function saveS(){
  const o={name:$('#sn').value.trim(),class_id:$('#sc').value||null,parent_phone:$('#sp').value.trim(),discount_type:$('#sd').value,discount_value:+$('#sv').value||0,discount_reason:$('#sr').value.trim()};
  if(!o.name)return alert('Nhập họ tên');
  const id=$('#sid').value;await q(id?sb.from('students').update(o).eq('id',id):sb.from('students').insert(o));reload();
}
async function delS(id){if(confirm('Xóa học sinh này và toàn bộ điểm danh của em?')){await q(sb.from('students').delete().eq('id',id));reload()}}

// ---------- Điểm danh ----------
function vAtt(){
  M.innerHTML=`<h3>Điểm danh</h3><div class="card"><select id="ac" onchange="loadAtt()"><option value="">-- Chọn lớp --</option>${clsOpts()}</select><input type="date" id="ad" value="${today()}" onchange="loadAtt()"></div><div id="al"></div>`;
}
async function loadAtt(){
  const cid=$('#ac').value,d=$('#ad').value,st=S.students.filter(s=>s.class_id==cid);
  if(!cid||!d||!st.length){$('#al').innerHTML=cid?'<p>Lớp chưa có học sinh.</p>':'';return}
  const ex=await q(sb.from('attendance').select('student_id,present').eq('date',d).in('student_id',st.map(s=>s.id)));
  const m=Object.fromEntries(ex.map(e=>[e.student_id,e.present]));
  $('#al').innerHTML=`<div class="sc"><table>${st.map(s=>`<tr><td>${esc(s.name)}</td><td>
  <label><input type="radio" name="r${s.id}" value="1" ${m[s.id]!==false?'checked':''}> Có mặt</label>
  <label><input type="radio" name="r${s.id}" value="0" ${m[s.id]===false?'checked':''}> Vắng</label></td></tr>`).join('')}</table></div><p><button onclick="saveAtt()">Lưu điểm danh</button></p>`;
}
async function saveAtt(){
  const cid=$('#ac').value,d=$('#ad').value,fee=S.classes.find(c=>c.id==cid).fee;
  const rows=S.students.filter(s=>s.class_id==cid).map(s=>({student_id:s.id,class_id:cid,date:d,present:document.querySelector(`input[name="r${s.id}"]:checked`).value==='1',fee}));
  await q(sb.from('attendance').upsert(rows,{onConflict:'student_id,date'}));alert('Đã lưu điểm danh ngày '+d);
}

// ---------- Học phí ----------
function vFee(){
  M.innerHTML=`<h3>Học phí</h3><div class="card noprint"><input type="month" id="fm" value="${today().slice(0,7)}" onchange="calcFee()"><select id="fc" onchange="calcFee()"><option value="">-- Chọn lớp --</option>${clsOpts()}</select>
  <button class="ghost" onclick="csv()">Xuất Excel (CSV)</button><button class="ghost" onclick="print()">In / Lưu PDF</button></div><div id="fr"></div>`;
}
async function calcFee(){
  const cid=$('#fc').value,mo=$('#fm').value;if(!cid||!mo)return;
  const[y,m]=mo.split('-').map(Number),last=String(new Date(y,m,0).getDate()).padStart(2,'0'),st=S.students.filter(s=>s.class_id==cid);
  if(!st.length){$('#fr').innerHTML='<p>Lớp chưa có học sinh.</p>';R=[];return}
  const at=await q(sb.from('attendance').select('student_id,date,fee').eq('present',true).gte('date',mo+'-01').lte('date',mo+'-'+last).in('student_id',st.map(s=>s.id)).order('date'));
  R=st.map(s=>{const a=at.filter(x=>x.student_id===s.id),g=a.reduce((t,x)=>t+Number(x.fee),0);
    const dc=s.discount_type==='percent'?Math.min(g,g*s.discount_value/100):s.discount_type==='fixed'?Math.min(g,Number(s.discount_value)):0;
    return{code:s.code,name:s.name,n:a.length,days:a.map(x=>(+x.date.slice(8))+'/'+m).join(', '),g,dc,reason:s.discount_reason||'',due:g-dc}});
  const T=R.reduce((t,r)=>t+r.due,0);
  $('#fr').innerHTML=`<h4>Học phí ${esc(clsName(cid))} — tháng ${m}/${y}</h4><div class="sc"><table><tr><th>Mã HS</th><th>Họ tên</th><th>Số buổi</th><th>Ngày học</th><th>Học phí gốc</th><th>Giảm trừ</th><th>Phải thu</th></tr>
  ${R.map(r=>`<tr><td>${r.code}</td><td>${esc(r.name)}</td><td>${r.n}</td><td>${r.days}</td><td>${vnd(r.g)}</td><td>${r.dc?vnd(r.dc)+' '+esc(r.reason):'—'}</td><td><b>${vnd(r.due)}</b></td></tr>`).join('')}
  <tr><td colspan="6"><b>Tổng</b></td><td><b>${vnd(T)}</b></td></tr></table></div>`;
}
function csv(){
  if(!R.length)return alert('Hãy chọn tháng và lớp trước.');
  const rows=[['Mã HS','Họ tên','Số buổi','Ngày học','Học phí gốc','Giảm trừ','Lý do','Phải thu'],...R.map(r=>[r.code,r.name,r.n,r.days,r.g,Math.round(r.dc),r.reason,Math.round(r.due)])];
  const t='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='hocphi-'+$('#fm').value+'.csv';a.click();
}
</script></body></html>
